<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>DLP Add-in</title>

        <!-- Office JavaScript API -->
        <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

        <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
        <link
            rel="stylesheet"
            href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"
        />

        <!-- Template styles -->
        <link href="taskpane.css" rel="stylesheet" />
    </head>

    <body class="ms-font-m ms-welcome ms-Fabric">
        <header id="app-header" class="ms-welcome__header">
            <img
                width="90"
                height="90"
                src="../../assets/taskpane-filled.png"
                alt="Contoso"
                title="Contoso"
            />
            <h3 class="ms-font-x1">
                Welcome to the Data Loss Prevention add-in. Use this tool to analyse composed emails prior to
                sending to check for any potential and unwanted data leaks. Click the 'Scan Email' button to
                begin.
            </h3>
        </header>
        <div id="back-bar" style="display: none">
            <button id="back-btn">&#8592; Back</button>
        </div>
        <section id="sideload-msg" class="ms-welcome__main">
            <h2 class="ms-font-xl">
                Please
                <a
                    target="_blank"
                    href="https://learn.microsoft.com/office/dev/add-ins/testing/test-debug-office-add-ins#sideload-an-office-add-in-for-testing"
                    >sideload</a
                >
                your add-in to see app body.
            </h2>
        </section>
        <main id="app-body" class="ms-welcome__main" style="display: none">
            <div>
                <button id="scan-email-btn">Scan Email</button>
            </div>
            <div id="output" class="taskpane-output"></div>
            <p><label id="item-subject"></label></p>
        </main>
    </body>
</html>
